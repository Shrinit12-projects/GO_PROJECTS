# prometheus.yml - minimal config

global:
  scrape_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape auth-service (we'll expose /metrics later in Go)
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8080"]

