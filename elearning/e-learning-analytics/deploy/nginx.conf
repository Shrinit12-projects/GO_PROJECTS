# nginx.conf - API Gateway for E-Learning Analytics

events {
    worker_connections 1024;
}

http {
    # ────────────────────────────────
    # Basic settings
    # ────────────────────────────────
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout 65;

    # Log format (JSON for easy parsing)
    log_format main_json escape=json
        '{ "time":"$time_iso8601", '
        '"remote_addr":"$remote_addr", '
        '"request":"$request", '
        '"status": "$status", '
        '"body_bytes_sent":"$body_bytes_sent", '
        '"request_time":"$request_time", '
        '"upstream_response_time":"$upstream_response_time", '
        '"upstream_addr":"$upstream_addr" }';

    access_log /var/log/nginx/access.log main_json;
    error_log  /var/log/nginx/error.log warn;

    # ────────────────────────────────
    # Upstream services
    # ────────────────────────────────
    upstream auth_service {
        server auth-service:8080;
    }

    # upstream course_service {
    #     server course-service:8080;
    # }

    # upstream progress_service {
    #     server progress-service:8080;
    # }

    # upstream analytics_service {
    #     server analytics-service:8080;
    # }

    # ────────────────────────────────
    # Server (entrypoint)
    # ────────────────────────────────
    server {
        listen 80;

        # Health check for gateway itself
        location /health {
            return 200 '{"status":"ok","service":"nginx-gateway"}';
            add_header Content-Type application/json;
        }

        # Auth routes
        location /auth/ {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            proxy_pass http://auth_service/auth/;
        }

        # Swagger documentation
        location /swagger/ {
            proxy_pass http://auth_service/swagger/;
        }

        # # Course routes
        # location /courses/ {
        #     proxy_pass http://course_service/;
        # }

        # # Progress routes
        # location /progress/ {
        #     proxy_pass http://progress_service/;
        # }

        # # Analytics routes
        # location /analytics/ {
        #     proxy_pass http://analytics_service/;
        # }
    }
}
