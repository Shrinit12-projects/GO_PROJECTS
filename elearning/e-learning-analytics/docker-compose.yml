version: "3.9"

# ────────────────────────────────
# E-Learning Analytics Platform
# Base infrastructure with service stubs
# ────────────────────────────────
services:
  # ────────────────────────────────
  # API Gateway - Nginx
  # ────────────────────────────────
  nginx:
    image: nginx:1.25
    container_name: api-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
    networks:
      - elearn_net

  # ────────────────────────────────
  # Auth Service (Go)
  # JWT issuing, refresh, blacklisting
  # ────────────────────────────────
  auth-service:
    build: ./services/auth
    container_name: auth-service
    env_file:
      - ./services/auth/.env
    networks:
      - elearn_net
    depends_on:
      - mongodb
      - redis

  # ────────────────────────────────
  # MongoDB (Single Instance)
  # ────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - elearn_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5


  # ────────────────────────────────
  # Redis (Cache + Session Store)
  # ────────────────────────────────
  redis:
    image: redis:7.2
    container_name: redis-cache
    command: ["redis-server", "--requirepass", "redispassword"]
    ports:
      - "6379:6379"
    networks:
      - elearn_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ────────────────────────────────
  # Prometheus (Metrics Collection)
  # ────────────────────────────────
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - elearn_net

  # ────────────────────────────────
  # Grafana (Visualization)
  # ────────────────────────────────
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - elearn_net
    depends_on:
      - prometheus

# ────────────────────────────────
# Networks & Volumes
# ────────────────────────────────
networks:
  elearn_net:
    driver: bridge

volumes:
  mongo_data:
  grafana_data:

